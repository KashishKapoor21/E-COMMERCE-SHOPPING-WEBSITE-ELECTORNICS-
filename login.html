<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ElectroMart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f6f8;
            display: flex;
            flex-direction: column;
            color: #222;
        }

        header {
            height: 80px;
            padding: 0 8%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .logo {
            text-decoration: none;
            font-size: 25px;
            font-weight: 800;
            color: #222;
        }

        .logo span {
            color: #3737a5;
        }

        .back {
            text-decoration: none;
            color: #444;
            font-size: 14px;
        }

        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 45px 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 42px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 10px 40px #0000000a;
        }

        .welcome {
            color: #3737a5;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 9px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            height: 48px;
            border: 1px solid #ddd;
            border-radius: 7px;
            padding: 0 14px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #3737a5;
            box-shadow: 0 0 0 3px #3737a51a;
        }

        .remember {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #555;
            margin-bottom: 24px;
        }

        .login-btn {
            width: 100%;
            height: 49px;
            border: none;
            border-radius: 7px;
            background: #3737a5;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #27277d;
        }

        .register-text {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #777;
        }

        .register-text a {
            color: #3737a5;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            background: #35363b;
            color: #aaa;
            text-align: center;
            padding: 20px;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            header {
                padding: 0 6%;
            }

            .container {
                padding: 28px 22px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="logo">
        ELECTRO<span>MART</span>
    </a>

    <a href="index.html" class="back">← Back to Home</a>
</header>

<main class="main">
    <section class="container">

        <p class="welcome">WELCOME BACK</p>

        <h1>Login to your account.</h1>

        <p class="subtitle">
            Access your account to continue exploring the latest technology.
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email Address</label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <label class="remember">
                <input type="checkbox" id="remember">
                Remember me
            </label>

            <button type="submit" class="login-btn">
                Login to Account
            </button>

        </form>

        <p class="register-text">
            Don't have an account?
            <a href="register.html">Create one</a>
        </p>

    </section>
</main>

<footer>
    © 2026 ElectroMart. All rights reserved.
</footer>

<script>
    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const savedUser = JSON.parse(
            localStorage.getItem("electromartUser") || "null"
        );

        if (!savedUser) {
            alert("Please create an account first.");
            window.location.href = "register.html";
            return;
        }

        if (email.toLowerCase() !== savedUser.email.toLowerCase()) {
            alert("Incorrect email address.");
            return;
        }

        if (password !== savedUser.password) {
            alert("Incorrect password.");
            return;
        }

        localStorage.setItem("electromartLoggedIn", "true");

        window.location.href = "account.html";
    });
</script>

</body>
</html>
