<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | ElectroMart</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f6f8;
            color: #222;
            display: flex;
            flex-direction: column;
        }

        header {
            background: white;
            padding: 24px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
        }

        .logo {
            text-decoration: none;
            font-size: 25px;
            font-weight: 800;
            color: #222;
        }

        .logo span {
            color: #3737a5;
        }

        .back {
            text-decoration: none;
            color: #444;
            font-size: 14px;
        }

        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 45px 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 38px;
            border-radius: 14px;
            box-shadow: 0 10px 40px #0000000a;
        }

        .welcome {
            color: #3737a5;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 31px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input:not([type="checkbox"]) {
            width: 100%;
            height: 46px;
            padding: 0 13px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 14px;
            outline: none;
        }

        input:focus {
            border-color: #3737a5;
            box-shadow: 0 0 0 3px #3737a51a;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 9px;
            margin: 22px 0;
            font-size: 12px;
            line-height: 1.6;
            color: #666;
        }

        .terms input {
            margin-top: 3px;
        }

        .terms a,
        .login-text a {
            color: #3737a5;
            text-decoration: none;
            font-weight: bold;
        }

        .register-btn {
            width: 100%;
            height: 49px;
            border: none;
            border-radius: 7px;
            background: #3737a5;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:hover {
            background: #27277d;
        }

        .login-text {
            text-align: center;
            margin-top: 23px;
            font-size: 13px;
            color: #777;
        }

        footer {
            background: #35363b;
            color: #aaa;
            text-align: center;
            padding: 20px;
            font-size: 12px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 28px 22px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="index.html" class="logo">
        ELECTRO<span>MART</span>
    </a>

    <a href="index.html" class="back">← Back to Home</a>
</header>

<main class="main">
    <section class="container">

        <p class="welcome">JOIN ELECTROMART</p>

        <h1>Create your account.</h1>

        <p class="subtitle">
            Sign up to discover products, explore deals and enjoy
            a personalized shopping experience.
        </p>

        <form id="registerForm">

            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input
                    type="text"
                    id="fullname"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your 10-digit number"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Create Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="At least 8 characters"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter your password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
            </div>

            <label class="terms">
                <input type="checkbox" id="terms" required>

                <span>
                    I agree to the
                    <a href="#">Terms and Conditions</a>
                    and
                    <a href="#">Privacy Policy</a>.
                </span>
            </label>

            <button type="submit" class="register-btn">
                Create Account
            </button>

        </form>

        <p class="login-text">
            Already have an account?
            <a href="login.html">Login</a>
        </p>

    </section>
</main>

<footer>
    © 2026 ElectroMart. All rights reserved.
</footer>

<script>
    const registerForm = document.getElementById("registerForm");

    registerForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const name = document.getElementById("fullname").value.trim();
        const email = document.getElementById("email").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
            alert("Passwords do not match!");
            return;
        }

        const existingUser = JSON.parse(
            localStorage.getItem("electromartUser") || "null"
        );

        if (
            existingUser &&
            existingUser.email.toLowerCase() === email.toLowerCase()
        ) {
            alert("This email is already registered. Please log in.");
            window.location.href = "login.html";
            return;
        }

        const user = {
            name: name,
            email: email,
            phone: phone,
            password: password
        };

        localStorage.setItem("electromartUser", JSON.stringify(user));

        localStorage.setItem("electromartLoggedIn", "true");

        alert("Account created successfully!");

        window.location.href = "account.html";
    });
</script>

</body>
</html>
